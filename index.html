<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mystery Inc. Summit · Coolsville</title>
<meta name="description" content="Conferencemaxxing for the Mystery Inc. Summit — an attendee face sheet with priority tiers, notes, and a spaced-repetition quiz." />
<meta property="og:title" content="Mystery Inc. Summit · Coolsville" />
<meta property="og:description" content="Conferencemaxxing for the Mystery Inc. Summit — face sheet + spaced-repetition quiz." />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d4429'/%3E%3Ctext x='50%25' y='56%25' font-size='38' text-anchor='middle' fill='%23ffffff' font-family='system-ui,sans-serif' font-weight='700'%3E%3F%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #f5f5f4;
    --card: #ffffff;
    --ink: #111111;
    --ink-2: #555555;
    --ink-3: #888888;
    --rule: #eaeaea;
    --brand: #0d4429;
    --brand-ink: #ffffff;
    --pill-gray-bg: #c5c5c4;
    --pill-gray-ink: #ffffff;
    --pill-green-bg: #0d4429;
    --pill-green-ink: #ffffff;
    --pill-amber-bg: #b07a16;
    --pill-amber-ink: #ffffff;
    --pill-red-bg: #8a2a2a;
    --pill-red-ink: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0b;
      --card: #161616;
      --ink: #f2f2f2;
      --ink-2: #b8b8b8;
      --ink-3: #888888;
      --rule: #242424;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.5);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.4;
    min-height: 100dvh;
  }
  .app {
    max-width: 540px;
    margin: 0 auto;
    padding: 0 0 96px 0;
  }
  /* Event header */
  .event {
    background: var(--brand);
    color: var(--brand-ink);
    padding: 20px 20px 20px 20px;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .event h1 {
    font-size: 22px;
    margin: 0 0 4px 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .event .meta { font-size: 14px; opacity: 0.75; }
  .event .legend {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .legend .pill { font-size: 11px; padding: 4px 10px; }
  .quiz-cta {
    margin-left: auto;
    background: #ffffff;
    color: var(--brand);
    border: 0;
    font-weight: 700;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .quiz-cta:hover { background: #f0f0f0; }
  /* Section header */
  .section-h {
    padding: 18px 20px 8px 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-h .due-count {
    font-size: 11px;
    color: var(--ink-2);
    text-transform: none;
    letter-spacing: 0;
    font-weight: 500;
  }
  /* Attendee row */
  .list { display: flex; flex-direction: column; }
  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    background: var(--card);
    border-top: 1px solid var(--rule);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 120ms ease;
  }
  .row:last-child { border-bottom: 1px solid var(--rule); }
  .row:hover { background: color-mix(in oklab, var(--card) 92%, var(--brand) 8%); }
  .row:active { background: color-mix(in oklab, var(--card) 86%, var(--brand) 14%); }
  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    flex: 0 0 56px;
    background: #ddd;
    overflow: hidden;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.06);
  }
  .avatar svg { width: 100%; height: 100%; display: block; }
  .who { flex: 1; min-width: 0; }
  .name { font-weight: 700; font-size: 15px; line-height: 1.2; display: flex; align-items: center; gap: 6px; }
  .mastery {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    margin-left: 2px;
  }
  .mastery .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--rule);
  }
  .mastery .dot.on { background: var(--brand); }
  .title { font-size: 13px; color: var(--ink-2); margin-top: 2px; line-height: 1.25; }
  .company { font-weight: 700; color: var(--brand); }
  @media (prefers-color-scheme: dark) {
    .company { color: #4fa37a; }
    .mastery .dot.on { background: #4fa37a; }
  }
  .pills { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .pill {
    display: inline-block;
    border-radius: 999px;
    padding: 3px 9px;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
    white-space: nowrap;
  }
  .pill.tier { background: var(--pill-gray-bg); color: var(--pill-gray-ink); }
  .pill.high { background: var(--pill-green-bg); color: var(--pill-green-ink); }
  .pill.med  { background: var(--pill-amber-bg); color: var(--pill-amber-ink); }
  .pill.low  { background: var(--pill-red-bg);   color: var(--pill-red-ink); }

  /* Detail sheet */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms ease;
    z-index: 10;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--card);
    color: var(--ink);
    max-width: 540px;
    margin: 0 auto;
    border-radius: 24px 24px 0 0;
    transform: translateY(100%);
    transition: transform 280ms cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 11;
    max-height: 92dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
  }
  .sheet.open { transform: translateY(0); }
  .sheet .top-band {
    background: var(--brand);
    color: var(--brand-ink);
    padding: 16px 20px 18px 20px;
    position: relative;
  }
  .sheet .top-band h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .sheet .top-band .sub { font-size: 13px; opacity: 0.75; margin-top: 2px; }
  .sheet .close {
    position: absolute;
    top: 14px; right: 14px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    color: white;
    border: 0;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sheet .close:hover { background: rgba(255,255,255,0.25); }
  .sheet-body {
    overflow-y: auto;
    padding: 0 20px 28px 20px;
  }
  .sheet .handle {
    width: 36px; height: 4px; border-radius: 999px;
    background: rgba(255,255,255,0.4);
    margin: 0 auto 10px auto;
  }
  .person-head {
    display: flex;
    gap: 14px;
    align-items: center;
    padding: 20px 0 8px 0;
  }
  .person-head .avatar { width: 76px; height: 76px; flex: 0 0 76px; }
  .person-head .pname { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.1; }
  .person-head .ptitle { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
  .person-head .pcompany { color: var(--brand); font-weight: 700; }
  @media (prefers-color-scheme: dark) {
    .person-head .pcompany { color: #4fa37a; }
  }
  .person-pills { display: flex; gap: 8px; margin: 10px 0 4px 0; flex-wrap: wrap; }
  .field {
    border-top: 1px solid var(--rule);
    padding: 14px 0 4px 0;
  }
  .field h3 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 8px 0;
  }
  .field p { margin: 0 0 12px 0; font-size: 15px; line-height: 1.45; color: var(--ink); }

  /* Quiz overlay */
  .quiz {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 20;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .quiz.open { display: flex; }
  .quiz-top {
    background: var(--brand);
    color: var(--brand-ink);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .quiz-top .qtitle { font-weight: 700; font-size: 15px; flex: 1; }
  .quiz-top .qclose {
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    color: white;
    border: 0;
    font-size: 18px;
    cursor: pointer;
  }
  .progress {
    height: 4px;
    background: rgba(255,255,255,0.2);
  }
  .progress-fill {
    height: 100%;
    background: #ffffff;
    width: 0%;
    transition: width 200ms ease;
  }
  .quiz-body {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px 28px 20px;
    max-width: 540px;
    margin: 0 auto;
    width: 100%;
  }
  .quiz-portrait {
    width: 220px; height: 220px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--card);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .quiz-portrait svg { width: 100%; height: 100%; display: block; }
  .quiz-prompt {
    font-size: 18px;
    font-weight: 600;
    color: var(--ink-2);
    margin-bottom: 16px;
  }
  .quiz-choices {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    width: 100%;
  }
  .choice {
    background: var(--card);
    color: var(--ink);
    border: 1.5px solid var(--rule);
    padding: 14px 16px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
    font-family: inherit;
  }
  .choice:hover:not(:disabled) {
    border-color: var(--brand);
    background: color-mix(in oklab, var(--card) 94%, var(--brand) 6%);
  }
  .choice:disabled { cursor: default; }
  .choice.correct {
    background: color-mix(in oklab, var(--card) 70%, #0d4429 30%);
    border-color: #0d4429;
    color: #ffffff;
  }
  .choice.wrong {
    background: color-mix(in oklab, var(--card) 70%, #8a2a2a 30%);
    border-color: #8a2a2a;
    color: #ffffff;
  }
  .choice.dim { opacity: 0.5; }
  .quiz-feedback {
    margin-top: 18px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 14px;
    color: var(--ink);
    line-height: 1.45;
    display: none;
  }
  .quiz-feedback.show { display: block; }
  .quiz-feedback .who-bold { font-weight: 700; }
  .quiz-feedback .ctx { color: var(--ink-2); margin-top: 6px; }
  .next-btn {
    margin-top: 18px;
    width: 100%;
    background: var(--brand);
    color: var(--brand-ink);
    border: 0;
    padding: 14px 16px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    display: none;
  }
  .next-btn.show { display: block; }
  .next-btn:hover { background: #0a3520; }
  /* Quiz summary */
  .summary {
    text-align: center;
    padding-top: 20px;
  }
  .summary h2 {
    font-size: 28px;
    margin: 0 0 4px 0;
    letter-spacing: -0.01em;
  }
  .summary .score {
    font-size: 48px;
    font-weight: 800;
    color: var(--brand);
    margin: 12px 0 4px 0;
  }
  @media (prefers-color-scheme: dark) {
    .summary .score { color: #4fa37a; }
  }
  .summary .score-sub { color: var(--ink-2); font-size: 14px; }
  .summary .next-up {
    margin-top: 22px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 14px 16px;
    text-align: left;
    font-size: 13px;
    color: var(--ink-2);
    line-height: 1.5;
  }
  .summary .next-up b { color: var(--ink); }
  .summary-actions {
    margin-top: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .summary-actions button {
    border: 0;
    padding: 14px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .summary-actions .secondary {
    background: var(--card);
    border: 1.5px solid var(--rule);
    color: var(--ink);
  }
  .summary-actions .primary {
    background: var(--brand);
    color: var(--brand-ink);
  }
  /* Empty state inside quiz when no cards due */
  .empty-state {
    text-align: center;
    padding-top: 30px;
  }
  .empty-state h2 { margin: 0 0 6px 0; font-size: 22px; }
  .empty-state p { color: var(--ink-2); font-size: 14px; margin: 0 0 20px 0; }

  /* Footer ribbon */
  .footer {
    padding: 24px 20px 8px 20px;
    text-align: center;
    color: var(--ink-3);
    font-size: 12px;
  }
  .footer a { color: var(--ink-3); }
  .built {
    display: inline-block;
    margin-top: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--rule);
    font-size: 11px;
  }
</style>
</head>
<body>
<div class="app">
  <header class="event">
    <h1>Mystery Inc. Summit · Coolsville</h1>
    <div class="meta">June 13–14, 2026 · 10 attendees</div>
    <div class="legend">
      <span class="pill high">High priority</span>
      <span class="pill med">Medium priority</span>
      <span class="pill low">Low priority</span>
      <button class="quiz-cta" id="startQuiz">Quiz me ▸</button>
    </div>
  </header>

  <div class="section-h">
    <span>Attendees</span>
    <span class="due-count" id="dueCount"></span>
  </div>
  <div class="list" id="list"></div>

  <div class="footer">
    Single-use software · audience of one<br />
    <span class="built">Built by Claude · Conferencemaxxing demo</span>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-hidden="true">
  <div class="top-band">
    <div class="handle"></div>
    <h2>Mystery Inc. Summit · Coolsville</h2>
    <div class="sub">June 13–14, 2026 · 10 attendees</div>
    <button class="close" id="close" aria-label="Close">×</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</aside>

<section class="quiz" id="quiz" aria-hidden="true">
  <div class="quiz-top">
    <div class="qtitle" id="qtitle">Face &amp; name quiz</div>
    <button class="qclose" id="qclose" aria-label="Close quiz">×</button>
  </div>
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  <div class="quiz-body" id="quizBody"></div>
</section>

<script>

const PRIORITY_LABEL = { high: "High priority", med: "Medium priority", low: "Low priority" };

// ─── Spaced repetition state ──────────────────────────────────────────────
const SRS_KEY = "mystery-inc-srs-v1";
// box → ms until next review. Box 0 = brand-new or just got wrong → due now.
const BOX_INTERVAL_MS = [
  0,              // box 0: due now
  60 * 1000,      // box 1: +1 minute (within-session retries)
  24 * 3600_000,  // box 2: +1 day
  3 * 24 * 3600_000,
  7 * 24 * 3600_000,
  14 * 24 * 3600_000 // box 5: mastered for now
];

function loadSrs() {
  try { return JSON.parse(localStorage.getItem(SRS_KEY) || "{}"); }
  catch { return {}; }
}
function saveSrs(s) {
  try { localStorage.setItem(SRS_KEY, JSON.stringify(s)); } catch {}
}
function cardState(id) {
  const s = loadSrs();
  return s[id] || { box: 0, lastReview: 0, nextReview: 0, history: [] };
}
function reviewCard(id, correct) {
  const s = loadSrs();
  const cur = s[id] || { box: 0, lastReview: 0, nextReview: 0, history: [] };
  cur.box = correct ? Math.min(cur.box + 1, 5) : 0;
  cur.lastReview = Date.now();
  cur.nextReview = Date.now() + BOX_INTERVAL_MS[cur.box];
  cur.history = (cur.history || []).concat([{ c: !!correct, t: Date.now() }]).slice(-20);
  s[id] = cur;
  saveSrs(s);
}
function dueAttendees() {
  const now = Date.now();
  return ATTENDEES.filter(a => {
    const c = cardState(a.id);
    return !c.lastReview || c.nextReview <= now;
  });
}
function nextDueSummary() {
  const now = Date.now();
  const upcoming = ATTENDEES
    .map(a => ({ a, c: cardState(a.id) }))
    .filter(x => x.c.lastReview && x.c.nextReview > now)
    .sort((x, y) => x.c.nextReview - y.c.nextReview);
  if (!upcoming.length) return null;
  const ms = upcoming[0].c.nextReview - now;
  if (ms < 60_000) return "in less than a minute";
  if (ms < 3600_000) return `in about ${Math.round(ms / 60_000)} minute${Math.round(ms/60000)===1?"":"s"}`;
  if (ms < 24 * 3600_000) return `in about ${Math.round(ms / 3600_000)} hour${Math.round(ms/3600000)===1?"":"s"}`;
  const days = Math.round(ms / (24 * 3600_000));
  return `in about ${days} day${days === 1 ? "" : "s"}`;
}

  for (let i = 1; i <= 5; i++) out += `<span class="dot${i <= box ? ' on' : ''}"></span>`;

}

// ─── Quiz ─────────────────────────────────────────────────────────────────
let quizQueue = [];   // cards still to ask this session
let quizDone = [];    // [{id, correct}]
let quizTotal = 0;

function startQuiz() {
  const due = dueAttendees();
  quizQueue = shuffle(due.length ? due.slice() : ATTENDEES.slice());
  quizDone = [];
  quizTotal = quizQueue.length;
  closeSheet();
  document.getElementById('quiz').classList.add('open');
  document.getElementById('quiz').setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  nextQuestion();
}
function closeQuiz() {
  document.getElementById('quiz').classList.remove('open');
  document.getElementById('quiz').setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  renderList(); // refresh mastery dots and due count
}
function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function updateProgress() {
  const totalSteps = quizTotal;
  const completed = quizDone.length;
  const pct = totalSteps ? (completed / totalSteps) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('qtitle').textContent =
    `Face & name quiz · ${Math.min(completed + 1, totalSteps)} of ${totalSteps}`;
}

function nextQuestion() {
  const body = document.getElementById('quizBody');
  if (!quizQueue.length) {
    showSummary();
    return;
  }
  updateProgress();
  const card = quizQueue.shift();
  // Pick 3 distractor names from other attendees
  const distractors = shuffle(ATTENDEES.filter(a => a.id !== card.id)).slice(0, 3);
  const choices = shuffle([card, ...distractors]);
  body.innerHTML = `
    <div class="quiz-portrait">${PORTRAITS[card.id] || ''}</div>
    <div class="quiz-prompt">Who is this?</div>
    <div class="quiz-choices" id="choices">
      ${choices.map(c => `<button class="choice" data-id="${c.id}">${c.name}</button>`).join('')}
    </div>
    <div class="quiz-feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">Next ▸</button>
  `;
  body.scrollTop = 0;
  body.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => handleAnswer(card, btn.dataset.id, btn));
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    quizDone.push({ id: card.id, correct: quizDone.lastWasCorrect });
    nextQuestion();
  });
}

function handleAnswer(card, chosenId, btn) {
  const correct = chosenId === card.id;
  reviewCard(card.id, correct);
  quizDone.lastWasCorrect = correct;
  // Lock all buttons and mark them
  document.querySelectorAll('.choice').forEach(b => {
    b.disabled = true;
    if (b.dataset.id === card.id) b.classList.add('correct');
    else if (b === btn && !correct) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  // If wrong, requeue the card later in this session
  if (!correct) {
    const insertAt = Math.min(quizQueue.length, 2 + Math.floor(Math.random() * 2));
    quizQueue.splice(insertAt, 0, card);
    quizTotal += 1;
  }
  const fb = document.getElementById('feedback');
  fb.innerHTML = correct
    ? `<span class="who-bold">${card.name}</span> — ${card.title} at ${card.company}.<div class="ctx">${card.signal}</div>`
    : `That was <span class="who-bold">${card.name}</span> — ${card.title} at ${card.company}.<div class="ctx">${card.context}</div>`;
  fb.classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
  document.getElementById('nextBtn').focus();
}

function showSummary() {
  // Compute first-pass score: only count the first attempt for each unique card
  const seen = new Set();
  let firstTryCorrect = 0;
  let uniqueCount = 0;
  for (const a of quizDone) {
    if (seen.has(a.id)) continue;
    seen.add(a.id);
    uniqueCount += 1;
    if (a.correct) firstTryCorrect += 1;
  }
  const body = document.getElementById('quizBody');
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('qtitle').textContent = 'Quiz complete';
  const upcoming = nextDueSummary();
  body.innerHTML = `
    <div class="summary">
      <h2>Nice work.</h2>
      <div class="score">${firstTryCorrect}/${uniqueCount}</div>
      <div class="score-sub">first-try answers</div>
      <div class="next-up">
        ${upcoming
          ? `Next review is due <b>${upcoming}</b>. Wrong answers come back sooner; mastered cards space out.`
          : `Every card is now scheduled for future review. Come back tomorrow to keep it fresh.`}
      </div>
      <div class="summary-actions">
        <button class="secondary" id="quizAgain">Again</button>
        <button class="primary" id="quizDoneBtn">Done</button>
      </div>
    </div>
  `;
  document.getElementById('quizAgain').addEventListener('click', startQuiz);
  document.getElementById('quizDoneBtn').addEventListener('click', closeQuiz);
}

document.getElementById('startQuiz').addEventListener('click', startQuiz);
document.getElementById('qclose').addEventListener('click', closeQuiz);
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('quiz').classList.contains('open')) closeQuiz();
  else closeSheet();
});

// ─── Boot ─────────────────────────────────────────────────────────────────
renderList();
if (location.hash) {
  const id = location.hash.slice(1);
  if (id === 'quiz') startQuiz();
  else if (ATTENDEES.some(x => x.id === id)) openSheet(id);
}
</script>
</body>
</html>
